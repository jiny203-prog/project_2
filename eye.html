<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facial Mole Reading</title>
<!-- 引入外部 CSS 文件 -->
<link rel="stylesheet" href="eye.css">
</head>
<body>

<!-- 小眼睛按钮 -->
<button class="eye-btn" id="eyeBtn">👁️</button>

<!-- 弹窗 (Modal) -->
<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeBtn">&times;</span>
        <h3 class="legend-title">Legend</h3>
        
        <div class="legend-item">
            <div class="legend-dot dot-good"></div>
            <span>red - good moles</span>
        </div>
        
        <div class="legend-item">
            <div class="legend-dot dot-bad"></div>
            <span>black - bad moles</span>
        </div>
    </div>
</div>

<!-- 控制弹窗逻辑的 JavaScript -->
<script>
    const modal = document.getElementById("infoModal");
    const eyeBtn = document.getElementById("eyeBtn");
    const closeBtn = document.getElementById("closeBtn");

    // 点击小眼睛，显示弹窗
    eyeBtn.onclick = function() {
        modal.style.display = "block";
    }

    // 点击右上角 X，关闭弹窗
    closeBtn.onclick = function() {
        modal.style.display = "none";
    }

    // 点击弹窗以外的黑色遮罩背景，也会关闭弹窗
    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>

</body>
</html>
